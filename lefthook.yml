pre-commit:
  piped: true
  follow: true

  commands:
    fmt:
      run: cargo fmt --all --check

    spacing:
      run: bash krabb-scripts/spacing.sh --check

    check:
      run: CARGO_BUILD_JOBS=4 cargo check --workspace --locked

    test:
      run: CARGO_BUILD_JOBS=4 cargo test --workspace --locked --lib --bins
