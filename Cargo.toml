[workspace]
members = [
    "krabb-core",
    "krabb-libs/date",
    "krabb-libs/logging",
    "krabb-libs/file",
    "krabb-libs/process",
    "krabb-runtime",
    "krabb",
    "krabb-daemon",
    "krabb-plugins/intelligence/anthropic",
    "krabb-plugins/intelligence/codex",
    "krabb-plugins/intelligence/gemini",
    "krabb-plugins/intelligence/ollama",
    "krabb-plugins/intelligence/openrouter",
    "krabb-plugins/intelligence/openai",
    "krabb-plugins/acp",
    "krabb-plugins/a2a",
    "krabb-plugins/ag-ui",
    "krabb-plugins/mcp",
    "krabb-plugins/memory",
    "krabb-plugins/messaging/discord",
    "krabb-plugins/messaging/signal",
    "krabb-plugins/messaging/slack",
    "krabb-plugins/messaging/telegram",
    "krabb-plugins/messaging/whatsapp",
    "krabb-plugins/sqlite",
    "krabb-plugins/scheduler",
    "krabb-plugins/tools",
    "krabb-plugins/browser",
    "krabb-plugins/computer",
    "krabb-plugins/tui",
    "krabb-plugins/whisper",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["Francesco Sardone"]
repository = "https://github.com/krabblab/krabb"
homepage = "https://github.com/krabblab/krabb"
readme = "README.md"
publish = false

[workspace.dependencies]
base64 = "0.23"
krabb-date = { path = "krabb-libs/date" }
krabb-log = { path = "krabb-libs/logging" }
crossterm = "0.29"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.4"
jiff = { version = "0.2.28", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
keyring = { version = "4.2.0", default-features = true }
ring = "0.17"
rustix = { version = "1.1", features = ["process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "fs", "net", "process", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
toml = "1.1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
