[package]
name = "krabb-runtime"
description = "Krabb host runtime shared by the CLI and daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
base64.workspace = true
clap.workspace = true
clap_complete.workspace = true
krabb-process = { path = "../krabb-libs/process" }
krabb-log.workspace = true
krabb-core = { path = "../krabb-core" }
krabb-date.workspace = true
krabb-file = { path = "../krabb-libs/file" }
getrandom.workspace = true
jiff.workspace = true
keyring.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
