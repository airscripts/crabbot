name: Security

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      local:
        description: "Use the local act working tree"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        if: inputs.local != 'true'
        uses: actions/checkout@v7

      - name: Audit Rust Dependencies
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432

        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Dependency Policy
        uses: EmbarkStudios/cargo-deny-action@v2

        with:
          rust-version: "1.89.0"
