name: Package

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  agent:
    name: Agent (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: Linux x86_64
            os: linux
            arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz

          - name: Linux aarch64
            os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz

          - name: macOS x86_64
            os: macos
            arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz

          - name: macOS aarch64
            os: macos
            arch: aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz

          - name: Windows x86_64
            os: windows
            arch: x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip

          - name: Windows aarch64
            os: windows
            arch: aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7

        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@1.99

        with:
          targets: ${{ matrix.target }}

      - if: matrix.archive == 'tar.gz'
        name: Build Unix Archives

        env:
          KRABB_VERSION: ${{ inputs.version }}
          KRABB_TARGET: ${{ matrix.target }}

        run: bash krabb-scripts/package.sh "$KRABB_VERSION" "$KRABB_TARGET"

      - if: matrix.archive == 'zip'
        name: Build Windows Archives
        shell: pwsh

        env:
          KRABB_VERSION: ${{ inputs.version }}
          KRABB_TARGET: ${{ matrix.target }}

        run: |
          $ErrorActionPreference = "Stop"
          cargo build --workspace --release --locked --target "$env:KRABB_TARGET"
          $version = $env:KRABB_VERSION
          $target = $env:KRABB_TARGET
          $plugins = @("core", "acp", "a2a", "ag-ui", "codex", "anthropic", "openai", "gemini", "ollama", "openrouter", "telegram", "discord", "whatsapp", "signal", "slack", "sqlite", "memory", "scheduler", "tools", "mcp", "whisper", "tui", "browser", "computer")

          foreach ($plugin in $plugins) {
            $name = if ($plugin -eq "core") { "krabb" } else { "krabb-plugin-$plugin" }

            $package = "krabb-$plugin-v$version-$target"
            New-Item -ItemType Directory -Force -Path $package | Out-Null
            New-Item -ItemType Directory -Force -Path "$package/bin" | Out-Null
            Copy-Item "target/$target/release/$name.exe" "$package/bin/$name.exe"

            if ($plugin -eq "core") {
              Copy-Item "target/$target/release/krabb-daemon.exe" "$package/bin/"
            }

            Copy-Item LICENSE, NOTICE "$package/"
            if ($plugin -ne "core") {
              $manifest = Get-ChildItem "krabb-plugins" -Recurse -Filter "krabb-plugin.toml" |
                Where-Object { $_.Directory.Name -eq $plugin } | Select-Object -First 1

              if (-not $manifest) { throw "Plugin manifest is missing: $plugin." }
              Copy-Item $manifest.FullName "$package/"
            }

            Compress-Archive -Path $package -DestinationPath "$package.zip" -Force
            Remove-Item -Recurse -Force $package
            Write-Output "Created $package.zip."
          }

      - if: matrix.archive == 'tar.gz'
        name: Validate Unix Archives
        shell: bash

        env:
          KRABB_VERSION: ${{ inputs.version }}
          KRABB_TARGET: ${{ matrix.target }}
          KRABB_OS: ${{ matrix.os }}

        run: |
          set -euo pipefail
          archives=(krabb-*-v${KRABB_VERSION}-${KRABB_TARGET}.tar.gz)
          [[ ${#archives[@]} -eq 24 ]]
          stage=$(mktemp -d)

          for archive in "${archives[@]}"; do
            krabb-scripts/check.sh "$archive"
            name=${archive%.tar.gz}
            tar -xzf "$archive" -C "$stage"
            package="$stage/$name"
            [[ -f "$package/LICENSE" && -f "$package/NOTICE" ]]
            [[ -d "$package/bin" ]]

            if [[ "$name" == krabb-core-* ]]; then
              [[ -x "$package/bin/krabb" && -x "$package/bin/krabb" && -x "$package/bin/krabb-daemon" ]]
              "$package/bin/krabb" version
              "$package/bin/krabb" version
              smoke="$stage/service-smoke"
              mkdir -p "$smoke/home" "$smoke/config"

              HOME="$smoke/home" XDG_CONFIG_HOME="$smoke/config" KRABB_HOME="$smoke/home/krabb" \
                "$package/bin/krabb" service install

              HOME="$smoke/home" XDG_CONFIG_HOME="$smoke/config" KRABB_HOME="$smoke/home/krabb" \
                "$package/bin/krabb" service status

              case "$KRABB_OS" in
                linux) service="$smoke/config/systemd/user/krabb.service" ;;
                macos) service="$smoke/home/Library/LaunchAgents/it.airscript.krabb.plist" ;;
                *) exit 1 ;;
              esac

              test -f "$service"
              rm -f "$service"
            else
              [[ -f "$package/krabb-plugin.toml" ]]
              plugin=${name#krabb-}
              plugin=${plugin%-v*}
              binary="krabb-plugin-$plugin"
              [[ -x "$package/bin/$binary" ]]
            fi
          done

      - if: matrix.archive == 'tar.gz'
        name: Validate Unix Installer
        shell: bash

        env:
          KRABB_VERSION: ${{ inputs.version }}
          KRABB_TARGET: ${{ matrix.target }}

        run: |
          set -euo pipefail

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum krabb-*-v${KRABB_VERSION}-${KRABB_TARGET}.tar.gz > SHA256SUMS
          else
            shasum -a 256 krabb-*-v${KRABB_VERSION}-${KRABB_TARGET}.tar.gz > SHA256SUMS
          fi

          prefix="$RUNNER_TEMP/krabb-prefix"

          KRABB_VERSION="$KRABB_VERSION" \
            KRABB_RELEASE_BASE="file://$PWD" \
            KRABB_PREFIX="$prefix" \
            sh install.sh
          "$prefix/bin/krabb" version
          "$prefix/bin/krabb" version

      - if: matrix.archive == 'zip'
        name: Validate Windows Archives
        shell: pwsh

        env:
          KRABB_VERSION: ${{ inputs.version }}
          KRABB_TARGET: ${{ matrix.target }}

        run: |
          $ErrorActionPreference = "Stop"
          $archives = @(Get-ChildItem "krabb-*-v$env:KRABB_VERSION-$env:KRABB_TARGET.zip")
          if ($archives.Count -ne 24) { throw "Expected 24 plugin and core archives, found $($archives.Count)." }

          foreach ($archive in $archives) {
            $destination = Join-Path $env:RUNNER_TEMP $archive.BaseName
            Expand-Archive -Path $archive.FullName -DestinationPath $destination -Force
            $package = Join-Path $destination $archive.BaseName

            if (!(Test-Path "$package/LICENSE") -or !(Test-Path "$package/NOTICE")) {
              throw "Archive is missing license files: $($archive.Name)."
            }

            if (!(Test-Path "$package/bin")) { throw "Archive is missing binaries: $($archive.Name)." }

            if ($archive.BaseName -like "krabb-core-*") {
              if (!(Test-Path "$package/bin/krabb.exe") -or !(Test-Path "$package/bin/krabb.exe") -or !(Test-Path "$package/bin/krabb-daemon.exe")) {
                throw "Core archive is missing an executable."
              }
              & "$package/bin/krabb.exe" version
              if ($LASTEXITCODE -ne 0) { throw "Packaged CLI failed to start." }
              & "$package/bin/krabb.exe" version
              if ($LASTEXITCODE -ne 0) { throw "Packaged CLI alias failed to start." }
            } else {
              if (!(Test-Path "$package/krabb-plugin.toml")) { throw "Plugin manifest is missing." }
              $plugin = $archive.BaseName -replace "^krabb-", "" -replace "-v.*$", ""
              $binary = "krabb-plugin-$plugin.exe"
              if (!(Test-Path "$package/bin/$binary")) { throw "Plugin executable is missing." }
            }
          }

      - if: matrix.archive == 'zip'
        name: Validate Windows Installer
        shell: pwsh

        env:
          KRABB_VERSION: ${{ inputs.version }}
          KRABB_TARGET: ${{ matrix.target }}

        run: |
          $ErrorActionPreference = "Stop"

          $lines = Get-ChildItem "krabb-*-v$env:KRABB_VERSION-$env:KRABB_TARGET.zip" |
            ForEach-Object { "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($_.Name)" }

          $lines | Set-Content -Encoding ascii SHA256SUMS
          $env:KRABB_RELEASE_BASE = ([Uri]((Get-Location).Path)).AbsoluteUri.TrimEnd('/')
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "krabb-local"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          & "$env:GITHUB_WORKSPACE/install.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Packaged installer failed." }
          & "$env:LOCALAPPDATA/Krabb/bin/krabb.exe" version
          if ($LASTEXITCODE -ne 0) { throw "Installed CLI failed to start." }
          & "$env:LOCALAPPDATA/Krabb/bin/krabb.exe" version
          if ($LASTEXITCODE -ne 0) { throw "Installed CLI alias failed to start." }

      - name: Upload Archives
        uses: actions/upload-artifact@v7

        with:
          name: krabb-v${{ inputs.version }}-${{ matrix.target }}
          path: krabb-*-v${{ inputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error
