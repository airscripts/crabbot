name: Test

on:
  workflow_dispatch:
    inputs:
      local:
        description: "Use the local act working tree"
        required: false
        type: string
        default: ""

  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ""

      local:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  agent:
    name: Agent (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: Linux x86_64
            os: linux
            arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            coverage: true
            coverage_profile: full
            coverage_package_min: 80
            coverage_runtime_min: 80

          - name: Linux aarch64
            os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            coverage: true
            coverage_profile: full
            coverage_package_min: 80
            coverage_runtime_min: 80

          - name: macOS x86_64
            os: macos
            arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            coverage: true
            coverage_profile: platform
            coverage_package_min: 60
            coverage_runtime_min: 40

          - name: macOS aarch64
            os: macos
            arch: aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            coverage: true
            coverage_profile: platform
            coverage_package_min: 60
            coverage_runtime_min: 40

          - name: Windows x86_64
            os: windows
            arch: x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            coverage: true
            coverage_profile: platform
            coverage_package_min: 60
            coverage_runtime_min: 40

          - name: Windows aarch64
            os: windows
            arch: aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            coverage: true
            coverage_profile: platform
            coverage_package_min: 60
            coverage_runtime_min: 40

    steps:
      - name: Checkout
        if: inputs.local != 'true'
        uses: actions/checkout@v7

        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust Toolchain
        if: inputs.local != 'true'
        uses: dtolnay/rust-toolchain@1.89

        with:
          components: llvm-tools-preview
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - if: matrix.coverage
        name: Install Coverage Tool
        uses: taiki-e/install-action@v2

        with:
          tool: cargo-llvm-cov

      - if: matrix.coverage
        name: Run Coverage
        shell: bash
        env:
          CRABBOT_COVERAGE_PACKAGE_MIN: ${{ matrix.coverage_package_min }}
          CRABBOT_COVERAGE_RUNTIME_MIN: ${{ matrix.coverage_runtime_min }}

        run: bash crabbot-scripts/coverage.sh "${{ matrix.coverage_profile }}"

      - if: matrix.coverage == false
        name: Run Workspace Tests
        run: cargo test --workspace --no-fail-fast --locked --target "${{ matrix.target }}"

      - name: Check Unix Installer Inputs
        if: runner.os != 'Windows'
        shell: bash

        run: |
          sh install.sh --help
          if CRABBOT_VERSION=1.0.0 sh install.sh unsupported; then
            printf '%s\n' 'Installer accepted an unsupported plugin.' >&2
            exit 1
          fi

          if CRABBOT_VERSION=invalid sh install.sh; then
            printf '%s\n' 'Installer accepted an invalid version.' >&2
            exit 1
          fi

      - name: Check Windows Installer Inputs
        if: runner.os == 'Windows'
        shell: pwsh

        run: |
          .\install.ps1 --help
          pwsh -NoProfile -File .\install.ps1 unsupported
          if ($LASTEXITCODE -eq 0) { throw 'Installer accepted an unsupported plugin.' }
          $env:CRABBOT_VERSION = 'invalid'
          pwsh -NoProfile -File .\install.ps1
          if ($LASTEXITCODE -eq 0) { throw 'Installer accepted an invalid version.' }
          exit 0

  sandbox:
    name: Tools Plugin Sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:

      - name: Checkout
        if: inputs.local != 'true'
        uses: actions/checkout@v7

        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust Toolchain
        if: inputs.local != 'true'
        uses: dtolnay/rust-toolchain@1.89

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build Tools Plugin
        run: cargo build --locked -p crabbot-plugin-tools

      - name: Prepare Sandbox Image
        run: docker pull busybox:1.36.1

      - name: Run Sandbox Smoke Test

        env:
          CRABBOT_SANDBOX_RUNTIME: docker
          CRABBOT_SANDBOX_IMAGE: busybox:1.36.1

        run: crabbot-scripts/sandbox.sh target/debug/crabbot-plugin-tools
