name: Test

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: make coverage
      - if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: cargo test --workspace --locked
      - name: Check Installer Inputs
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh install.sh --help
          if CRABBOT_VERSION=1.0.0 sh install.sh unsupported; then
            printf '%s\n' 'Installer accepted an unsupported plugin.' >&2
            exit 1
          fi
          if CRABBOT_VERSION=invalid sh install.sh; then
            printf '%s\n' 'Installer accepted an invalid version.' >&2
            exit 1
          fi
      - name: Check Installer Inputs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\install.ps1 --help
          pwsh -NoProfile -File .\install.ps1 unsupported
          if ($LASTEXITCODE -eq 0) { throw 'Installer accepted an unsupported plugin.' }
          $env:CRABBOT_VERSION = 'invalid'
          pwsh -NoProfile -File .\install.ps1
          if ($LASTEXITCODE -eq 0) { throw 'Installer accepted an invalid version.' }

  sandbox:
    name: sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Tools Plugin
        run: cargo build --locked -p crabbot-plugin-tools
      - name: Prepare Sandbox Image
        run: docker pull busybox:1.36.1
      - name: Run Sandbox Smoke Test
        env:
          CRABBOT_SANDBOX_RUNTIME: docker
          CRABBOT_SANDBOX_IMAGE: busybox:1.36.1
        run: crabbot-scripts/sandbox.sh target/debug/crabbot-plugin-tools
