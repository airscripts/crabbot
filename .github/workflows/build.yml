name: Build

on:
  workflow_dispatch:
    inputs:
      local:
        description: "Use the local act working tree"
        required: false
        type: string
        default: ""

  workflow_call:
    inputs:
      local:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  crates:
    name: Crates
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: Linux x86_64
            os: linux
            arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

          - name: Linux aarch64
            os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

          - name: macOS x86_64
            os: macos
            arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin

          - name: macOS aarch64
            os: macos
            arch: aarch64
            runner: macos-15
            target: aarch64-apple-darwin

          - name: Windows x86_64
            os: windows
            arch: x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc

          - name: Windows aarch64
            os: windows
            arch: aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout
        if: inputs.local != 'true'
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        if: inputs.local != 'true'
        uses: dtolnay/rust-toolchain@1.89

        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build Workspace
        run: cargo build --workspace --release --locked --target "${{ matrix.target }}"

      - name: Verify Native CLI on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: ./target/${{ matrix.target }}/release/crabbot version

      - name: Verify Native CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\target\${{ matrix.target }}\release\crabbot.exe version
