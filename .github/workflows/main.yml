name: Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  agentskill:
    name: Agentskill
    uses: ./.github/workflows/agentskill.yml

  security:
    name: Security
    uses: ./.github/workflows/security.yml

  build:
    name: Build
    needs: test
    uses: ./.github/workflows/build.yml

  test:
    name: Test
    needs: verify
    uses: ./.github/workflows/test.yml
