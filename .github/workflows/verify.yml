name: Verify

on:
  workflow_dispatch:
    inputs:
      container_image:
        description: "Optional local CI container image"
        required: false
        type: string
        default: ""

      local:
        description: "Use the local act working tree"
        required: false
        type: string
        default: ""

  workflow_call:
    inputs:
      container_image:
        required: false
        type: string
        default: ""

      local:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  workspace:
    name: Workspace
    runs-on: ubuntu-latest
    container: ${{ inputs.container_image || 'rust:1.89-trixie' }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        if: inputs.local != 'true'
        uses: actions/checkout@v7

      - name: Install Metrics Tools
        if: inputs.local != 'true'
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ripgrep

      - name: Install Rust Components
        run: rustup component add rustfmt clippy

      - name: Check Formatting
        run: |
          cargo fmt --all --check
          bash krabb-scripts/spacing.sh --check

      - name: Run Clippy
        run: CARGO_BUILD_JOBS=4 cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check Documentation
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --locked

      - name: Check Shell Scripts
        run: bash -n krabb-scripts/*.sh install.sh

      - name: Report Metrics
        run: bash krabb-scripts/metrics.sh

  crate:
    name: Crate (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ inputs.container_image || 'rust:1.89-trixie' }}

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      max-parallel: 6

      matrix:
        include:
          - name: Core
            package: krabb-core

          - name: File
            package: krabb-file

          - name: Runtime
            package: krabb-runtime

          - name: CLI
            package: krabb

          - name: Daemon
            package: krabb-daemon

          - name: Anthropic Plugin
            package: krabb-plugin-anthropic

          - name: Codex Plugin
            package: krabb-plugin-codex

          - name: OpenAI Plugin
            package: krabb-plugin-openai

          - name: ACP Plugin
            package: krabb-plugin-acp

          - name: A2A Plugin
            package: krabb-plugin-a2a

          - name: AG-UI Plugin
            package: krabb-plugin-ag-ui

          - name: Gemini Plugin
            package: krabb-plugin-gemini

          - name: Ollama Plugin
            package: krabb-plugin-ollama

          - name: OpenRouter Plugin
            package: krabb-plugin-openrouter

          - name: Telegram Plugin
            package: krabb-plugin-telegram

          - name: Discord Plugin
            package: krabb-plugin-discord

          - name: WhatsApp Plugin
            package: krabb-plugin-whatsapp

          - name: Signal Plugin
            package: krabb-plugin-signal

          - name: Slack Plugin
            package: krabb-plugin-slack


          - name: Tools Plugin
            package: krabb-plugin-tools

          - name: Browser Plugin
            package: krabb-plugin-browser

          - name: Computer Plugin
            package: krabb-plugin-computer

          - name: Memory Plugin
            package: krabb-plugin-memory

          - name: Scheduler Plugin
            package: krabb-plugin-scheduler

          - name: SQLite Plugin
            package: krabb-plugin-sqlite

          - name: Whisper Plugin
            package: krabb-plugin-whisper

          - name: MCP Plugin
            package: krabb-plugin-mcp

          - name: TUI Plugin
            package: krabb-plugin-tui

    steps:
      - name: Checkout
        if: inputs.local != 'true'
        uses: actions/checkout@v7

      - name: Install Archive Tools
        if: inputs.local != 'true'
        run: |
          apt-get update
          apt-get install --no-install-recommends -y zip

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Test ${{ matrix.name }}
        run: cargo test --locked -p "${{ matrix.package }}"

  browser_integration:
    name: Browser Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        if: inputs.local != 'true'
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/krabb-playwright" playwright@1.64.1
          "$RUNNER_TEMP/krabb-playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: Build Browser Plugin
        run: cargo build --locked -p krabb-plugin-browser

      - name: Test Browser Routes
        run: node --test krabb-plugins/browser/tests/routes.mjs

      - name: Run Browser Integration
        run: node krabb-plugins/browser/tests/integration.mjs
        env:
          KRABB_BROWSER_PLUGIN: ${{ github.workspace }}/target/debug/krabb-plugin-browser
          KRABB_PLAYWRIGHT_MODULE: ${{ runner.temp }}/krabb-playwright/node_modules/playwright/index.js

  computer_integration:
    name: Computer Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        if: inputs.local != 'true'
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Isolated Desktop Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth xdotool imagemagick python3-tk

      - name: Build Computer Plugin
        run: cargo build --locked -p krabb-plugin-computer

      - name: Run Computer Integration
        run: python3 krabb-plugins/computer/tests/integration.py
        env:
          KRABB_COMPUTER_PLUGIN: ${{ github.workspace }}/target/debug/krabb-plugin-computer

  msrv:
    name: Minimum Rust Version
    runs-on: ubuntu-latest
    container: ${{ inputs.container_image || 'rust:1.89-trixie' }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        if: inputs.local != 'true'
        uses: actions/checkout@v7

      - name: Check Workspace
        run: CARGO_BUILD_JOBS=4 cargo check --workspace --all-targets --locked

  windows_gnu:
    name: Windows GNU
    runs-on: ubuntu-latest
    container: ${{ inputs.container_image || 'rust:1.89-trixie' }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        if: inputs.local != 'true'
        uses: actions/checkout@v7

      - name: Install MinGW
        if: inputs.local != 'true'
        run: |
          apt-get update
          apt-get install --no-install-recommends -y gcc-mingw-w64-x86-64
          x86_64-w64-mingw32-gcc --version

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check Windows GNU Target

        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo check --workspace --all-targets --target x86_64-pc-windows-gnu --locked

        env:
          CARGO_BUILD_JOBS: 4
