name: Agentskill

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    container: node:22-bookworm

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Agentskill

        env:
          CRABBOT_VERSION: "2.1.0"

        run: |
          set -euo pipefail
          archive="agentskill-${CRABBOT_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location "https://github.com/airscripts/agentskill/releases/download/${CRABBOT_VERSION}/${archive}" -o "$archive"
          curl --fail --location "https://github.com/airscripts/agentskill/releases/download/${CRABBOT_VERSION}/SHA256SUMS" -o SHA256SUMS
          grep "  ${archive}$" SHA256SUMS | sha256sum -c -
          tar -xzf "$archive"
          install -m 0755 "agentskill-${CRABBOT_VERSION}-x86_64-unknown-linux-gnu/agentskill" "$RUNNER_TEMP/agentskill"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate Guidance
        run: agentskill validate . --signature auto
