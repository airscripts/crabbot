name: Agentskill

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Agentskill
        env:
          VERSION: "2.1.0"
        run: |
          set -euo pipefail
          archive="agentskill-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location "https://github.com/airscripts/agentskill/releases/download/${VERSION}/${archive}" -o "$archive"
          curl --fail --location "https://github.com/airscripts/agentskill/releases/download/${VERSION}/SHA256SUMS" -o SHA256SUMS
          grep "  ${archive}$" SHA256SUMS | sha256sum -c -
          tar -xzf "$archive"
          install -m 0755 "agentskill-${VERSION}-x86_64-unknown-linux-gnu/agentskill" "$RUNNER_TEMP/agentskill"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: agentskill validate . --signature auto
