name: Agentskill

on:
  workflow_call:
    inputs:
      container_image:
        required: false
        type: string
        default: ""
      local:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      container_image:
        description: "Optional local CI container image"
        required: false
        type: string
        default: ""
      local:
        description: "Use the local act working tree"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    container: ${{ inputs.container_image || 'rust:1.89-trixie' }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        if: inputs.local != 'true'
        uses: actions/checkout@v7

      - name: Install Agentskill

        env:
          AGENTSKILL_VERSION: "2.1.0"

        run: |
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64) target="aarch64-unknown-linux-gnu" ;;
            x86_64|amd64) target="x86_64-unknown-linux-gnu" ;;
            *) printf 'Unsupported architecture: %s\n' "$(uname -m)" >&2; exit 1 ;;
          esac
          package="agentskill-${AGENTSKILL_VERSION}-${target}"
          archive="${package}.tar.gz"
          work="${RUNNER_TEMP}/agentskill"
          mkdir -p "${work}/bin"

          curl --fail --silent --show-error --location \
            "https://github.com/airscripts/agentskill/releases/download/${AGENTSKILL_VERSION}/${archive}" \
            --output "${work}/${archive}"
          curl --fail --silent --show-error --location \
            "https://github.com/airscripts/agentskill/releases/download/${AGENTSKILL_VERSION}/SHA256SUMS" \
            --output "${work}/SHA256SUMS"

          expected="$(awk -v archive="$archive" '$2 == archive { print $1 }' "${work}/SHA256SUMS")"
          test -n "$expected"
          printf '%s  %s\n' "$expected" "${work}/${archive}" | sha256sum --check --strict

          tar -xzf "${work}/${archive}" -C "$work"
          install -m 0755 "${work}/${package}/agentskill" "${work}/bin/agentskill"
          echo "${work}/bin" >> "$GITHUB_PATH"

      - name: Validate Guidance
        run: agentskill validate . --signature auto
