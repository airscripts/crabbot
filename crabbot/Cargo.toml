[package]
name = "crabbot"
description = "Crabbot is a lightweight, open-source general-purpose agent runtime that turns models, tools, memory, and messaging into an assistant you control."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "crabbot"
path = "src/main.rs"

[[bin]]
name = "crab"
path = "src/crab.rs"

[dependencies]
crabbot-runtime = { path = "../crabbot-runtime" }
tokio.workspace = true
