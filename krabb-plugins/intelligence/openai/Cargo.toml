[package]
name = "krabb-plugin-openai"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[dependencies]
krabb-log.workspace = true
krabb-core = { path = "../../../krabb-core" }
krabb-file = { path = "../../../krabb-libs/file" }
futures-util = "0.3"
keyring.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "fs", "net", "process", "signal", "sync", "time"] }
